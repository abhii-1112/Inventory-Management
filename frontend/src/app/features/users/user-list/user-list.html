<div class="header">
  <h2>Users</h2>
  <a routerLink="/users/new" class="btn-primary">+ New User</a>
</div>

@if (loading()) {
  <p>Loading users...</p>
}

@if (errorMessage()) {
  <p class="error">{{ errorMessage() }}</p>
}

@if (!loading() && !errorMessage()) {
  <table class="data-table">
    <thead>
      <tr>
        <th>Email</th>
        <th>Created At</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (user of users(); track user.id) {
        <tr>
          <td>{{ user.email }}</td>
          <td>{{ user.createdAt | date: 'medium' }}</td>
          <td>
            <a [routerLink]="['/users', user.id, 'edit']">Edit</a>
            <button (click)="deleteUser(user.id, user.email)" class="btn-danger">Delete</button>
          </td>
        </tr>
      }
      @empty {
        <tr><td colspan="3">No users yet.</td></tr>
      }
    </tbody>
  </table>
}
